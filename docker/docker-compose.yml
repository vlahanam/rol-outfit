name: rol-outfit

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rol-outfit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ../backend:/app
      - ../backend/uploads:/app/uploads
      - go_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rol-outfit-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      API_URL: http://backend:8080
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - rol-outfit-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../backend/uploads:/app/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rol-outfit-net

volumes:
  postgres_data:
  go_cache:

networks:
  rol-outfit-net:
    driver: bridge
